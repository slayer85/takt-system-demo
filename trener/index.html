<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Aplikacja dokowana. Ta meta jest PRZEŁĄCZNIKIEM dla build.mjs: tylko pliki,
     które ją mają, dostają manifest, ikonę i kolor paska. Trenerzy wchodzą tu
     z telefonu, więc ta strona ma być na ekranie początkowym jak zwykła apka. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Mój grafik</title>
<script src="supabase.js"></script>
<style>
  /* Nazwy zmiennych są TE SAME co w panelu i na stronie par (`--gold`,
     `--gold-d`, `--on-gold`) — dzięki temu arkusz motywu klienta, wstrzykiwany
     przez build na koniec <head>, przebarwia tę stronę bez ani jednej reguły
     napisanej specjalnie dla niej. Wcześniej akcent nazywał się `--akcent`
     i motyw go nie dosięgał; stąd czarno-biała strona przy złotej marce.
     `--gold-d` to ten sam kolor ciemniejszy, wyłącznie tam, gdzie złoto JEST
     tekstem — jasne złoto na bieli nie ma kontrastu do czytania. */
  :root{ --gold:#c9a84c; --gold-d:#8a6d34; --on-gold:#1a1a1a;
         --bg:#f4f4f5; --card:#fff; --border:#e3e1dd; --text:#1a1a1a;
         --muted:#6b6560; --ok:#2f7d4f; --dzis:#fff8e6; --ciemne:#1a1a1a; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--text);
        -webkit-font-smoothing:antialiased; }
  header{ background:var(--ciemne); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10;
          border-bottom:3px solid var(--gold); }
  .hdr{ display:flex; align-items:center; gap:12px; max-width:760px; margin:0 auto; }
  .hdr img{ height:38px; display:none; flex-shrink:0; }
  .hdr h1{ margin:0; font-size:1rem; font-weight:700; letter-spacing:.01em; }
  .hdr .kto{ margin:2px 0 0; font-size:.8rem; opacity:.75; }
  .hdr .wyloguj{ margin-left:auto; background:none; border:1px solid rgba(255,255,255,.35); color:#fff;
                 border-radius:8px; padding:7px 11px; font-size:.8rem; cursor:pointer; }
  main{ max-width:760px; margin:0 auto; padding:14px 14px 40px; }

  .dzien{ margin:20px 0 8px; font-size:.82rem; font-weight:700; letter-spacing:.07em;
          text-transform:uppercase; color:var(--muted); }
  .dzien.today{ color:#8a6410; }

  .lek{ background:var(--card); border:1px solid var(--border); border-radius:12px;
        padding:13px 14px; margin-bottom:9px; display:flex; align-items:center; gap:13px; }
  .lek.today{ background:var(--dzis); border-color:#e8d9a8; }
  .lek.minela{ opacity:.72; }
  .godz{ font-size:1.32rem; font-weight:800; font-variant-numeric:tabular-nums; min-width:62px; }
  .srodek{ flex:1; min-width:0; }
  .para{ font-size:1.02rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .para.wolne{ font-weight:500; color:var(--muted); }
  .meta{ font-size:.8rem; color:var(--muted); margin-top:2px; }
  .znak{ display:inline-block; font-size:.68rem; font-weight:800; padding:2px 6px; border-radius:4px;
         background:#efece5; color:#6b5b2e; margin-right:6px; }
  .znak.weekend{ background:#e6eef5; color:#2b5578; }

  .ptak{ border:1px solid var(--border); background:#fff; color:var(--muted); border-radius:10px;
         min-width:46px; height:44px; font-size:1.15rem; cursor:pointer; flex-shrink:0; }
  .ptak[aria-pressed="true"]{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .ptak:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .pusto{ background:var(--card); border:1px dashed var(--border); border-radius:12px;
          padding:26px 16px; text-align:center; color:var(--muted); }

  /* logowanie */
  #login{ min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:22px;
          background:var(--ciemne); }
  /* `overflow:hidden` jest tu z wyprzedzeniem: motyw klienta dokleja nad kartą
     pasek ze zdjęciem (`::before` z ujemnym marginesem), a bez tego zdjęcie
     wystawałoby poza zaokrąglone rogi. */
  #login .box{ background:#fff; border-radius:14px; padding:24px; width:100%; max-width:340px;
               overflow:hidden; }
  #login .box img.marka{ display:none; height:46px; width:auto; margin:0 0 12px; }
  #login .szkola{ font-size:.72rem; font-weight:800; letter-spacing:.11em; text-transform:uppercase;
                  color:var(--gold-d); margin:0 0 3px; }
  #login h2{ margin:0 0 4px; font-size:1.1rem; }
  #login p{ margin:0 0 16px; font-size:.85rem; color:var(--muted); }
  #login input{ width:100%; padding:12px; margin-bottom:10px; border:1px solid var(--border);
                border-radius:9px; font-size:16px; }
  #login button{ width:100%; padding:13px; border:none; border-radius:9px;
                 background:var(--gold); color:var(--on-gold);
                 font-weight:800; font-size:.95rem; cursor:pointer; }
  #loginErr{ margin-top:10px; font-size:.85rem; color:#a33a31; min-height:1.2em; }
  .hidden{ display:none !important; }
  /* Schowany komunikat wystawał: 120% własnej wysokości to mniej niż wysokość + 22 px odstępu
     od dołu, więc u dołu ekranu wisiał pasek (P1-9, 1.10.2026). Teraz zjeżdża w całości
     i znika z drzewa dostępności; odstęp uwzględnia pasek home iPhone'a. */
  #toast{ position:fixed; left:50%; bottom:max(22px, calc(14px + env(safe-area-inset-bottom)));
          transform:translateX(-50%) translateY(calc(100% + 60px)); visibility:hidden;
          background:var(--ciemne); color:#fff; padding:11px 17px; border-radius:10px; font-size:.88rem;
          transition:transform .25s, visibility 0s .25s; z-index:50; }
  #toast.show{ transform:translateX(-50%) translateY(0); visibility:visible; transition:transform .25s; }
  .ptak:disabled{ opacity:.35; cursor:not-allowed; }
</style>
<link rel="manifest" href="/trener/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#14130d">
<meta name="apple-mobile-web-app-title" content="Mój grafik">
<script>(function(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}})();</script>
</head>
<body>

<div id="login">
  <div class="box">
    <img id="loginLogo" class="marka" alt="">
    <div class="szkola" id="loginSzkola"></div>
    <h2>Mój grafik</h2>
    <p>Zaloguj się kontem trenera.</p>
    <input id="mail" type="email" inputmode="email" autocomplete="username" placeholder="adres e-mail" aria-label="adres e-mail">
    <input id="haslo" type="password" autocomplete="current-password" placeholder="hasło" aria-label="hasło">
    <button id="btnLogin">Zaloguj</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="hdr">
      <img id="logo" alt="">
      <div>
        <h1 id="tytul">Mój grafik</h1>
        <p class="kto" id="kto"></p>
      </div>
      <button class="wyloguj" id="btnWyloguj">Wyloguj</button>
    </div>
  </header>
  <main id="lista"></main>
</div>

<div id="toast"></div>
